#
# Builds the Sintergia image and pushes it to Docker Hub.
#
# Runs on GitHub's runners rather than locally, because the Vite asset build
# needs a 4GB Node heap (see NODE_OPTIONS in docker/Dockerfile).
#
# Required repository secrets:
#   DOCKERHUB_USERNAME - your Docker Hub username
#   DOCKERHUB_TOKEN    - a Docker Hub access token (NOT your password)
#
# Create the Docker Hub repository as PRIVATE before the first run;
# repositories default to public when created by a push.
#

name: Publish Sintergia docker image

on:
  push:
    branches:
      - develop
    tags:
      - v*
  workflow_dispatch:

env:
  DOCKER_REPO: alnroot/sintergia

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Chatwoot is MIT-licensed except for the enterprise/ directory, which is
      # under a separate commercial license. Strip it so the resulting image is
      # cleanly redistributable.
      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set Docker tags
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "TAGS=${DOCKER_REPO}:latest,${DOCKER_REPO}:${SHORT_SHA}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect pushed image
        run: docker buildx imagetools inspect ${{ env.DOCKER_REPO }}:latest
